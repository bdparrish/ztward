[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztward-sdk"
version = "0.2.0"
description = "Python SDK for Ztward services (Key Access, Key Manager, Platform, and ZTDF tooling)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Ztward" }]
dependencies = [
    "cryptography>=42.0.0",
    "googleapis-common-protos>=1.62.0",
    "grpcio>=1.76.0",  # generated *_pb2_grpc.py stubs require it
    "protobuf>=6.31.1",  # generated *_pb2.py stubs require it (gencode 6.31.1)
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["ztward_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
