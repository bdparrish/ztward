# PAP (Policy Administration Point) Server Configuration

service:
  name: pap-server
  version: 1.0.0
  environment: development

server:
  host: 0.0.0.0
  port: 8090
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 300s
  graceful_stop: 60s
  tls:
    enabled: true
    cert_file: /etc/ztward/certs/server.crt
    key_file: /etc/ztward/certs/server.key
    ca_file: /etc/ztward/certs/ca.crt
    client_ca_file: /etc/ztward/certs/ca.crt
    require_client_cert: false

database:
  driver: postgres
  host: postgres
  port: 5432
  database: ztward_pap
  user: ztward
  password: ztward  # Override via ZTWARD_DATABASE_PASSWORD
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

cache:
  type: redis
  ttl: 10m
  redis:
    address: redis:6379
    db: 0
    prefix: "ztward:policy:"

oidc:
  enabled: true
  issuer_url: http://keycloak:8080/realms/ztward
  # Development only: tokens are issued to the browser as http://localhost:8080/...,
  # while the PAP reaches Keycloak as http://keycloak:8080/..., so the issuer and
  # client-ID checks are skipped (token signatures are still verified against the
  # realm's keys). Set to false in production, where both URLs are the same.
  allow_insecure_issuer: true
  client_id: ztward-pap
  client_secret: ztward-pap-secret  # Override via ZTWARD_OIDC_CLIENT_SECRET
  redirect_url: http://localhost:8090/callback
  scopes:
    - openid
    - profile
    - email
    - groups

logging:
  level: info
  format: json
  output: stdout

security:
  rate_limiting:
    enabled: true
    requests_per_min: 200
    burst: 100
  cors:
    enabled: true
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
    expose_headers:
      - Content-Length
      - Content-Type
    allow_credentials: true
    max_age: 3600s
  fips:
    enabled: true
    go_module: v1.0.0

license:
  enabled: false
  file: /etc/ztward/license.jwt
  public_key_file: /etc/ztward/license-public.pem
  deployment_id: ""
  refresh_interval: 5m

observability:
  metrics:
    enabled: true
    address: ":9091"
    path: /metrics
