# Key Manager Service Configuration - Docker Deployment

service:
  name: key-manager
  version: 1.0.0
  environment: development

server:
  host: 0.0.0.0
  port: 50052
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 300s
  graceful_stop: 60s
  tls:
    enabled: true
    cert_file: /etc/ztward/certs/server.crt
    key_file: /etc/ztward/certs/server.key
    ca_file: /etc/ztward/certs/ca.crt
    client_ca_file: /etc/ztward/certs/ca.crt
    require_client_cert: false

database:
  driver: postgres
  host: postgres
  port: 5432
  database: ztward_keymanager
  user: ztward
  password: ztward  # Override via ZTWARD_DATABASE_PASSWORD
  sslmode: disable
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

encryption:
  algorithm: RSA2048
  key_rotation: false
  admin_key_provider: composite
  admin_key_config: /var/run/secrets/ztward/admin-key
  admin_keys:
    - admin

security:
  rate_limiting:
    enabled: false
    requests_per_min: 1000
    burst: 500
  cors:
    enabled: true
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
    expose_headers:
      - Content-Length
      - Content-Type
    allow_credentials: true
    max_age: 3600s
  fips:
    enabled: true
    go_module: v1.0.0

license:
  enabled: false
  file: /etc/ztward/license.jwt
  public_key_file: /etc/ztward/license-public.pem
  deployment_id: ""
  refresh_interval: 5m

oidc:
  enabled: true
  issuer_url: http://keycloak:8080/realms/ztward
  allow_insecure_issuer: true
  client_id: ztward-key-manager
  client_secret: ztward-key-manager-secret  # Override via ZTWARD_OIDC_CLIENT_SECRET
  redirect_url: http://localhost:8081/callback
  scopes:
    - openid
    - profile

logging:
  level: debug
  format: json
  output: stdout

observability:
  metrics:
    enabled: true
    address: ":9092"
    path: /metrics

key_manager:
  seed_sample_data: false
  seed_data_path: /etc/ztward/key-manager-seed.yaml
