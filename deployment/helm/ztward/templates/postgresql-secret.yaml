{{- if and .Values.postgresql.enabled .Values.secrets.postgresql.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ztward.postgresqlSecretName" . }}
  labels:
    {{- include "ztward.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.auth.postgresPassword | b64enc | quote }}
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  ztward-user: {{ .Values.postgresql.auth.ztwardUser | b64enc | quote }}
  ztward-password: {{ .Values.postgresql.auth.ztwardPassword | b64enc | quote }}
{{- end }}
