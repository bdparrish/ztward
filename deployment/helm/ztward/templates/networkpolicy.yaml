{{- if .Values.security.networkPolicy.enabled }}
# PostgreSQL Network Policy
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztward.fullname" . }}-postgresql
  labels:
    {{- include "ztward.postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztward.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.security.networkPolicy.policyTypes | nindent 4 }}
  ingress:
  # Allow from Platform
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.platform.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow from Key Manager
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.keyManager.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow from PAP
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.pap.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow from Keycloak
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.keycloak.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  egress:
  - {}
{{- end }}
