# Keycloak Network Policy
{{- if .Values.keycloak.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztward.fullname" . }}-keycloak
  labels:
    {{- include "ztward.keycloak.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztward.keycloak.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.security.networkPolicy.policyTypes | nindent 4 }}
  ingress:
  # Allow from Key Manager
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.keyManager.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.keycloak.service.port }}
  # Allow from Key Access
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.keyAccess.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.keycloak.service.port }}
  # Allow from PAP
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.pap.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.keycloak.service.port }}
  # Allow from PAP UI
  - from:
    - podSelector:
        matchLabels:
          {{- include "ztward.papUI.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.keycloak.service.port }}
  # Allow from Ingress
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: {{ .Values.keycloak.service.port }}
  egress:
  # Allow to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          {{- include "ztward.postgresql.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
{{- end }}
