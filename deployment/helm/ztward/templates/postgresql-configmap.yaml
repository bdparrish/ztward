{{- if and .Values.postgresql.enabled .Values.postgresql.initScripts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ztward.fullname" . }}-postgresql-init
  labels:
    {{- include "ztward.postgresql.labels" . | nindent 4 }}
data:
  01-init-multiple-dbs.sql: |
    -- Create shared user 'ztward' for both databases
    CREATE USER {{ .Values.postgresql.auth.ztwardUser }} WITH PASSWORD '{{ .Values.postgresql.auth.ztwardPassword }}';

    -- Create ztward_pap database
    CREATE DATABASE ztward_pap;
    GRANT ALL PRIVILEGES ON DATABASE ztward_pap TO {{ .Values.postgresql.auth.ztwardUser }};

    -- Create ztward_keymanager database
    CREATE DATABASE ztward_keymanager;
    GRANT ALL PRIVILEGES ON DATABASE ztward_keymanager TO {{ .Values.postgresql.auth.ztwardUser }};

  02-init.sql: |
    {{- .Files.Get "02-init.sql" | nindent 4 }}

  03-init-keymanager.sql: |
    {{- .Files.Get "03-init-keymanager.sql" | nindent 4 }}
{{- end }}