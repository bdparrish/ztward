{{- if .Values.secrets.ztward.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ztward.ztwardSecretName" . }}
  labels:
    {{- include "ztward.labels" . | nindent 4 }}
type: Opaque
data:
  # Database password for Ztward services
  database-password: {{ .Values.postgresql.auth.ztwardPassword | b64enc | quote }}

  # OIDC client secrets
  {{- if .Values.keyManager.enabled }}
  key-manager-oidc-secret: {{ .Values.keyManager.config.oidcClientSecret | b64enc | quote }}
  {{- end }}

  {{- if .Values.keyAccess.enabled }}
  key-access-oidc-secret: {{ .Values.keyAccess.config.oidcClientSecret | b64enc | quote }}
  {{- end }}

  {{- if .Values.pap.enabled }}
  pap-oidc-secret: {{ .Values.pap.config.oidcClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.ztward.adminKey }}
  admin-key: {{ .Values.secrets.ztward.adminKey | b64enc | quote }}
  {{- end }}
{{- end }}
