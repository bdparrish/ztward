{{- if .Values.platform.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ztward.fullname" . }}-platform-config
  labels:
    {{- include "ztward.platform.labels" . | nindent 4 }}
data:
  ztward.yaml: |
    # Platform Service Configuration
    service:
      name: platform-server
      version: 1.0.0
      environment: development
      policy_cache_ttl_seconds: {{ default 5 .Values.platform.config.policyCacheTTLSeconds }}

    server:
      host: "0.0.0.0"
      port: {{ .Values.platform.config.port }}
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 300s

    database:
      driver: postgres
      {{- if .Values.postgresql.enabled }}
      host: {{ include "ztward.postgresql.host" . }}
      port: {{ .Values.postgresql.service.port }}
      database: ztward_pap
      user: {{ .Values.postgresql.auth.ztwardUser }}
      password: {{ .Values.postgresql.auth.ztwardPassword }}
      {{- else }}
      host: {{ .Values.externalDatabase.host }}
      port: {{ .Values.externalDatabase.port }}
      database: ztward_pap
      user: {{ .Values.externalDatabase.username }}
      password: {{ .Values.externalDatabase.password }}
      {{- end }}
      {{- if .Values.postgresql.enabled }}
      sslmode: disable
      {{- else }}
      sslmode: require
      {{- end }}
      max_open_conns: 50
      max_idle_conns: 10

    cache:
      type: redis
      ttl: 10m
      redis:
        address: {{ include "ztward.redis.serviceName" . }}:{{ .Values.redis.service.port }}
        db: 0
        prefix: "ztward:policy:"

    logging:
      level: info
      format: json
      output: stdout

    {{- $rate := default (dict) .Values.keyAccess.config.rateLimiting }}
    security:
      rate_limiting:
        enabled: {{ default false $rate.enabled }}
        requests_per_min: {{ default 1000 $rate.requestsPerMin }}
        burst: {{ default 500 $rate.burst }}
{{- end }}
