apiVersion: v2
name: ztward
description: A production-grade Helm chart for Ztward - Zero Trust Data Fabric platform with cryptographic key management, ABAC policy enforcement, and secure data access control
type: application

# Chart version - increment with chart changes
version: 1.0.0

# Application version - matches the Ztward release version
appVersion: "1.0.0"

keywords:
  - zero-trust
  - data-fabric
  - key-management
  - abac
  - policy-enforcement
  - grpc
  - keycloak
  - oidc

maintainers:
  - name: Benjamin Parrish
    url: https://github.com/bdparrish

