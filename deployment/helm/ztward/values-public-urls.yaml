# Public URL Configuration for Ztward
# This file configures services to use their public ALB DNS names
#
# Usage:
#   helm install ztward ./ztward -n ztward \
#     -f values-ecr.yaml \
#     -f values-free-tier.yaml \
#     -f values-rds.yaml \
#     -f values-ingress.yaml \
#     -f values-public-urls.yaml

# =============================================================================
# Keycloak Public Configuration
# =============================================================================
keycloak:
  config:
    hostname: "auth.example.com"
    hostnamePort: "443"  # ALB listens on HTTPS port 443
    httpEnabled: true  # Still enable HTTP internally, ALB handles HTTPS termination

# =============================================================================
# PAP UI Configuration
# =============================================================================
papUI:
  env:
    VITE_KEYCLOAK_URL: "https://auth.example.com"
    VITE_KEYCLOAK_REALM: "ztward"
    VITE_KEYCLOAK_CLIENT_ID: "ztward-pap-ui"
    VITE_API_URL: "https://api.example.com"

# =============================================================================
# PAP API Configuration
# =============================================================================
pap:
  config:
    oidcIssuerUrl: "https://auth.example.com/realms/ztward"